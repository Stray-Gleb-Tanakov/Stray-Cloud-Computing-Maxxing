apiVersion: apps/v1
kind: Deployment
metadata:
  name: storingsmelder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storingsmelder
  template:
    metadata:
      labels:
        app: storingsmelder
    spec:
      containers:
        - name: web
          image: ghcr.io/stray-gleb-tanakov/storingsmelder:1.1
          ports:
            - containerPort: 8000
          env:
            # TODO: wachtwoord naar een Secret verplaatsen (opdracht 3)
            - name: DATABASE_URL
              value: postgresql://storing:storing123@db:5432/storingsmelder